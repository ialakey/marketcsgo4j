name: publish to maven central

# Manual on purpose. A release can be deleted from GitHub; a version published
# to Maven Central is there permanently, so this one is never triggered by a
# push. Run it against a tag once that tag's release workflow is green.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to publish, e.g. v0.1.1
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      # This workflow always runs from the default branch, but builds whatever
      # the tag contains. The two drift apart, and Maven only warns about a -P
      # naming a profile that is not there, so a tag cut before the publishing
      # setup existed would quietly deploy through the wrong plugin.
      - name: Check the tag can be published
        run: |
          version=$(./mvnw -B -ntp -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "version: $version"
          case "$version" in *SNAPSHOT)
            echo "::error::refusing to publish a snapshot"; exit 1;;
          esac
          grep -q '<id>central</id>' pom.xml || {
            echo "::error::this tag has no 'central' profile; tag a commit that does"
            exit 1
          }
          grep -q 'central-publishing-maven-plugin' pom.xml || {
            echo "::error::this tag has no Central publishing plugin"
            exit 1
          }

      # Tests run again rather than trusting the run that produced the tag. This
      # is the one upload that cannot be taken back.
      - name: Build, test, sign and publish
        run: ./mvnw -B -ntp -P central deploy
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          # Both spellings: setup-java wires the first into settings.xml, and
          # maven-gpg-plugin 3.x reads the second directly.
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
