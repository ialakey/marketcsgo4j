# JitPack builds tags on demand, which is how this library can be depended on
# before it is on Maven Central.
#
# Both lines are load-bearing. The build image defaults to an older JDK than
# this project needs, and its bundled Maven is older than the compiler plugin
# requires, so the build goes through the wrapper rather than whatever mvn
# happens to be on the image.
jdk:
  - openjdk21
install:
  - ./mvnw -B -ntp install -DskipTests
